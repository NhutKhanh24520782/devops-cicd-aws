apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-sa
  namespace: devops-project
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: devops-project
  labels:
    app: mongodb

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: mongodb

  # MongoDB is a stateful workload — Recreate avoids two Mongo instances
  # fighting over the same PVC (ReadWriteOnce can only be mounted by one node)
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      serviceAccountName: mongodb-sa

      containers:
      - name: mongodb
        image: mongo:7
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 27017

        env:
        - name: MONGO_INITDB_DATABASE
          value: devopsdb

        # startupProbe: gives MongoDB up to 2 min (24 × 5s) to initialise
        # before liveness kicks in — prevents restart loops on cold start / journal replay
        startupProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 24

        # readiness probe prevents backend from connecting before
        # MongoDB is actually accepting TCP connections (eliminates ECONNREFUSED)
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6

        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3

        # resource limits prevent OOM on the node
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db

      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc

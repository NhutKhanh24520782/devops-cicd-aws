apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: devops-project
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-project
  labels:
    app: frontend

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: frontend

  # rolling update with zero downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10

  template:
    metadata:
      labels:
        app: frontend

    spec:
      serviceAccountName: frontend-sa
      terminationGracePeriodSeconds: 30

      # Prefer different nodes for the 2 frontend replicas.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname

      containers:
      - name: frontend
        # Image tag is :latest here as a deploy-time placeholder.
        # Jenkins CI/CD overrides this via: kubectl set image deployment/frontend
        #   frontend=274118253913.dkr.ecr.ap-southeast-1.amazonaws.com/devops-project-dev-frontend:<BUILD_TAG>
        image: 274118253913.dkr.ecr.ap-southeast-1.amazonaws.com/devops-project-dev-frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80
          name: http

        # readiness probe: pod only receives ALB traffic after
        # Nginx is serving (returns 200 on /)
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1

        # liveness probe: restart if Nginx stops responding
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3

        # resource limits
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
